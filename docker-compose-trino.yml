version: '3.8'

services:
  trino:
    image: trinodb/trino:451
    container_name: lakehouse-trino
    ports:
      - "8090:8080"
    volumes:
      - ./trino/etc:/etc/trino
    # Trino starts normally using the mounted configs
    networks:
      - lakehouse-network

networks:
  lakehouse-network:
    external: true
    name: version_control_for_databases_lakehouse-network
