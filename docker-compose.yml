services:
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: lakehouse-minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lakehouse-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: lakehouse-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: metastore
      POSTGRES_PASSWORD: password123
    volumes:
      - nessie-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d metastore" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lakehouse-network
    restart: unless-stopped

  nessie:
    # Nessie - Git-like catalog with PostgreSQL persistence
    image: projectnessie/nessie:0.67.0
    container_name: lakehouse-nessie
    ports:
      - "19120:19120"
    environment:
      # Use JDBC version store with PostgreSQL (PERSISTENT!)
      - NESSIE_VERSION_STORE_TYPE=JDBC
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/metastore
      - QUARKUS_DATASOURCE_USERNAME=admin
      - QUARKUS_DATASOURCE_PASSWORD=password123
      - QUARKUS_HTTP_PORT=19120
    networks:
      - lakehouse-network
    depends_on:
      - postgres
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:19120/api/v2/config" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  spark-notebook:
    image: alexmerced/spark33-notebook
    container_name: lakehouse-spark
    ports:
      - "8888:8888"
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
      - AWS_S3_ENDPOINT=http://minio:9000
      - NESSIE_URI=http://nessie:19120/api/v1
      - WAREHOUSE=s3a://lakehouse/warehouse
    volumes:
      - ./data:/home/jovyan/data
      - ./scripts:/home/jovyan/scripts
    networks:
      - lakehouse-network
    depends_on:
      - minio
      - nessie

volumes:
  minio-data:
    driver: local
  nessie-db:
    driver: local

networks:
  lakehouse-network:
    driver: bridge
