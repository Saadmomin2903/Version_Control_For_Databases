version: '3.8'

services:
  spark-master:
    image: alexmerced/spark33-notebook
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8888:8888" # Jupyter
      - "7077:7077" # Spark Master (for worker connectivity)
      - "8081:8080" # Spark Master UI
      - "4040:4040" # Spark Driver UI
    environment:
      # Enable Spark Master mode for cluster operation
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=0.0.0.0
      - SPARK_DRIVER_MEMORY=4g
      - AWS_ACCESS_KEY_ID=${ORACLE_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${ORACLE_SECRET_KEY}
      - AWS_S3_ENDPOINT=${ORACLE_ENDPOINT}
      - AWS_REGION=${ORACLE_REGION}
      - NESSIE_URI=${NESSIE_URI}
      - WAREHOUSE=${WAREHOUSE}
    volumes:
      - ./scripts:/home/jovyan/scripts
      - ./data:/home/jovyan/data
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lakehouse-network

networks:
  lakehouse-network:
    driver: bridge
