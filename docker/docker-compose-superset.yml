version: "3.7"
services:
  db:
    image: postgres:15
    container_name: superset_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset_password
    networks:
      - lakehouse-network
    volumes:
      - superset_db_data:/var/lib/postgresql/data

  superset:
    build:
      context: ./superset_build
      dockerfile: Dockerfile
    container_name: superset_app
    restart: unless-stopped
    ports:
      - "8088:8088"
    depends_on:
      - db
    environment:
      - SUPERSET_SECRET_KEY=antigravity_secret_1234
      - SQLALCHEMY_DATABASE_URI=postgresql://superset:superset_password@db:5432/superset
      - SUPERSET_WEBSERVER_TIMEOUT=3600
      - SUPERSET_TIMEOUT=3600
      - SQLLAB_TIMEOUT=3600
      - GUNICORN_TIMEOUT=3600
      - DATABASE_DBNAME=superset
      - DATABASE_HOST=db
      - DATABASE_PASSWORD=superset_password
      - DATABASE_USER=superset
      - DATABASE_PORT=5432
      - EXECUTOR=Local
    networks:
      - lakehouse-network
    volumes:
      - superset_home:/app/superset_home

networks:
  lakehouse-network:
    external: true
    name: version_control_for_databases_lakehouse-network

volumes:
  superset_db_data:
  superset_home:
