# PRODUCTION Docker Compose - Based on YOUR Tested Local Setup
# Replaces: MinIO → Oracle Object Storage, PostgreSQL → Supabase
# Keeps: Same service names, same network, same dependencies

services:
  # REMOVED: minio (replaced by Oracle Object Storage - external)
  # REMOVED: postgres (replaced by Supabase PostgreSQL - external)

  nessie:
    # YOUR exact Nessie image and settings
    image: projectnessie/nessie:0.67.0
    container_name: lakehouse-nessie
    ports:
      - "19120:19120"
    environment:
      # CHANGED: Now points to Supabase PostgreSQL (not local)
      - NESSIE_VERSION_STORE_TYPE=JDBC
      - QUARKUS_DATASOURCE_JDBC_URL=${SUPABASE_JDBC_URL}
      - QUARKUS_DATASOURCE_USERNAME=postgres
      - QUARKUS_DATASOURCE_PASSWORD=${SUPABASE_PASSWORD}
      - QUARKUS_HTTP_PORT=19120
      - QUARKUS_LOG_LEVEL=INFO
    networks:
      - lakehouse-network
    healthcheck:
      # YOUR exact healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:19120/api/v2/config" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  # Airflow Webserver
  airflow-webserver:
    image: apache/airflow:2.8.0
    container_name: lakehouse-airflow
    network_mode: host
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${SUPABASE_JDBC_URL}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=production_secret_key_change_me
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - /var/run/docker.sock:/var/run/docker.sock # Allow triggering Docker commands
    ports:
      - "8089:8080" # Airflow UI
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com &&
               airflow webserver"
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.8.0
    container_name: lakehouse-airflow-scheduler
    network_mode: host
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${SUPABASE_JDBC_URL}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    command: airflow scheduler
    restart: unless-stopped

  spark-notebook:
    # YOUR exact Spark image
    image: alexmerced/spark33-notebook
    container_name: lakehouse-spark
    # Use host network so driver port is directly accessible by VM2 executors
    network_mode: host
    extra_hosts:
      - "spark-master:10.0.0.148" # Self-reference for hostname resolution
    environment:
      # CHANGED: Now points to Oracle Object Storage (not MinIO)
      - AWS_REGION=${ORACLE_REGION}
      - AWS_ACCESS_KEY_ID=${ORACLE_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${ORACLE_SECRET_KEY}
      - AWS_S3_ENDPOINT=${ORACLE_ENDPOINT}
      - NESSIE_URI=http://localhost:19120/api/v1
      - WAREHOUSE=${WAREHOUSE}
      # Spark Master configuration
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=0.0.0.0
      - SPARK_MASTER_PORT=7077
      - SPARK_DRIVER_MEMORY=4g
      - SPARK_EXECUTOR_MEMORY=8g
    volumes:
      # YOUR exact volume mounts
      - ./data:/home/jovyan/data
      - ./scripts:/home/jovyan/scripts
    depends_on:
      - nessie
    restart: unless-stopped
    # Start Spark Master in background, then run Jupyter (this keeps container alive)
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /opt/spark/sbin/start-master.sh -h 0.0.0.0 -p 7077
        sleep 3
        jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --NotebookApp.token='' --NotebookApp.password='' --allow-root &
        tail -f /opt/spark/logs/*.out
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 12G

networks:
  # YOUR exact network name
  lakehouse-network:
    driver: bridge

# REMOVED: Local volumes (minio-data, nessie-db)
# Data now stored in Oracle Object Storage and Supabase

#---

# Environment Variables Required (.env.prod):
#
# Supabase PostgreSQL:
#   SUPABASE_JDBC_URL=jdbc:postgresql://db.xxxxx.supabase.co:5432/postgres?sslmode=require
#   SUPABASE_PASSWORD=[your-password]
#
# Oracle Object Storage:
#   ORACLE_ACCESS_KEY=[your-access-key]
#   ORACLE_SECRET_KEY=[your-secret-key]
#   ORACLE_REGION=us-ashburn-1
#   ORACLE_ENDPOINT=https://objectstorage.us-ashburn-1.oraclecloud.com
#   WAREHOUSE=oci://[namespace]/lakehouse-prod/warehouse
